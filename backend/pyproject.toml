[project]
name = "backend"
version = "0.1.0"
description = "API and worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "psycopg[binary]",
    "pydantic-settings",
    "sqlalchemy>=2",
    "alembic>=1.20.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "SIM", "C4", "ASYNC", "RUF", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]  # cyrillic in strings and comments is fine

[tool.pytest.ini_options]
markers = ["small", "medium", "large"]
testpaths = ["tests"]
