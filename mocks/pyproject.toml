[project]
name = "mocks"
version = "0.1.0"
description = "Fake external sources for local development"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "pytest-cov>=7.1.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "SIM", "C4", "ASYNC", "RUF", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]  # cyrillic in strings and comments is fine

[tool.pytest.ini_options]
markers = [
    "positive: expected-behaviour scenario",
    "negative: error or failure scenario",
    "smoke: key path",
]
addopts = "--strict-markers"
testpaths = ["tests"]
