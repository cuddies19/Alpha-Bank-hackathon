<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вход — состояния</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="kk-tokens.css">
<link rel="stylesheet" href="ds/cabinet/components/bundle.css">
<link rel="stylesheet" href="kk-new.css">
<script src="ds/cabinet/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..900&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="box-sizing: border-box; width: 1120px; min-height: 720px; padding: 40px; background: var(--bg); color: var(--ink); font-family: var(--font-sans); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: start;">
  <div style="display: flex; flex-direction: column; gap: 12px;">
    <p class="caption" style="color: var(--ink-secondary);">Ошибка входа</p>
    <div style="box-sizing: border-box; background: var(--surface); border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 20px;">
      <h2 class="title-2">Вход</h2>
      <x-import component-from-global-scope="Cabinet.Alert" tone="danger" title="Неверный логин или пароль">Проверьте раскладку клавиатуры и попробуйте снова.</x-import>
      <x-import component-from-global-scope="Cabinet.TextField" label="Логин" default-value="шпщк.ыщлщдщм" error="Похоже, включена русская раскладка"></x-import>
      <x-import component-from-global-scope="Cabinet.TextField" label="Пароль" type="password" default-value="demo-2025"></x-import>
      <x-import component-from-global-scope="Cabinet.Button" variant="primary" size="lg" full-width="{{yes}}">Войти</x-import>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 12px;">
    <p class="caption" style="color: var(--ink-secondary);">Загрузка</p>
    <div style="box-sizing: border-box; background: var(--surface); border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 20px;">
      <h2 class="title-2">Вход</h2>
      <x-import component-from-global-scope="Cabinet.TextField" label="Логин" default-value="igor.sokolov" disabled="{{yes}}"></x-import>
      <x-import component-from-global-scope="Cabinet.TextField" label="Пароль" type="password" default-value="demo-2026" disabled="{{yes}}"></x-import>
      <x-import component-from-global-scope="Cabinet.Button" variant="primary" size="lg" full-width="{{yes}}" loading="{{yes}}">Входим</x-import>
      <p class="body-sm" style="color: var(--ink-secondary);">Загружаем данные по счёту ООО «Дом и уют»</p>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1120,"height":720}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true }; }
}
</script>
</body>
</html>
