<body>
<x-dc>

<nav class="kn-mnav" aria-label="Разделы кабинета" style="font-family: var(--font-sans);">

  </a>
  <a class="{{finCls}}" href="M-Need.dc.html" aria-current="{{finCur}}">

    Подбор
  </a>
  <a class="{{appsCls}}" href="M-Status.dc.html" aria-current="{{appsCur}}">
    <span class="kn-mnav__ic"><x-import component-from-global-scope="Cabinet.Icon" name="document" size="{{i22}}"></x-import></span>

  <a class="{{loansCls}}" href="B12-Loans.dc.html" aria-current="{{loansCur}}">

    Профиль
  </a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","financing","applications","loans","profile","none"],"default":"home"},"$preview":{"width":390,"height":72}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'home';
    const c = (k) => 'kn-mnav__item' + (a === k ? ' is-active' : '');
    const cur = (k) => (a === k ? 'page' : undefined);
    return {
      i22: 22,
      homeCls: c('home'), homeCur: cur('home'),
      finCls: c('financing'), finCur: cur('financing'),
      appsCls: c('applications'), appsCur: cur('applications'),
      loansCls: c('loans'), loansCur: cur('loans'),
      profCls: c('profile'), profCur: cur('profile')
    };
  }
}
</script>
