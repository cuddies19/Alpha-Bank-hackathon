<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Документы — Кредитный кабинет</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="kk-tokens.css">
<link rel="stylesheet" href="ds/cabinet/components/bundle.css">
<link rel="stylesheet" href="kk-new.css">
<script src="ds/cabinet/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..900&display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#d21f16}</style>
</helmet>
<div class="kn-app">
  <div class="kn-app__side"><dc-import name="NavClient" active="documents" hint-size="100%,900px"></dc-import></div>
  <main class="kn-app__main">
    <dc-import name="HeaderClient" hint-size="100%,72px"></dc-import>
    <div class="kn-page" style="gap: 24px;">
      <h1 class="title-1">Документы</h1>

      <div style="display: flex; flex-direction: column-reverse; gap: 24px;">
        <div style="display: flex; flex-direction: column; gap: 16px;">
          <div class="kn-toolbar">
            <label class="kn-field" style="flex-direction: row; align-items: center; gap: 8px;">
              <span class="label" style="color: var(--ink-secondary);">Заявка</span>
              <select class="kn-nselect" style="width: auto; height: 36px; font-size: 13px;">
                <option>Все заявки</option>
                <option>№ 2026-10-0142 · кредитная линия</option>
                <option>№ 2026-10-0097 · черновик</option>
              </select>
            </label>
            <span style="flex: 1;"></span>
            <span class="body-sm" style="color: var(--ink-secondary);">7 документов</span>
          </div>
          <div class="kn-tablewrap">
            <table class="kn-table">
              <thead><tr><th scope="col">Документ</th><th scope="col">Заявка</th><th scope="col">Дата</th><th scope="col">Статус</th><th scope="col"><span class="kk-sr">Действия</span></th></tr></thead>
              <tbody>
                <sc-for list="{{docs}}" as="d" hint-placeholder-count="7">
                  <tr>
                    <td><span style="display: flex; gap: 12px; align-items: center;"><span class="kk-doc__icon"><x-import component-from-global-scope="Cabinet.Icon" name="document"></x-import></span><span><span class="body-strong">{{d.name}}</span><span class="kn-sub">{{d.meta}}</span></span></span></td>
                    <td class="nw">{{d.app}}</td>
                    <td class="nw">{{d.date}}</td>
                    <td><x-import component-from-global-scope="Cabinet.Badge" tone="{{d.tone}}">{{d.status}}</x-import></td>
                    <td class="nw" style="text-align: right;">
                      <x-import component-from-global-scope="Cabinet.Button" variant="ghost" size="sm">Открыть</x-import>
                      <x-import component-from-global-scope="Cabinet.Button" variant="ghost" size="sm" icon-left="arrow-down">Скачать</x-import>
                      <sc-if value="{{d.replace}}" hint-placeholder-val="{{no}}"><x-import component-from-global-scope="Cabinet.Button" variant="secondary" size="sm" icon-left="upload">Заменить</x-import></sc-if>
                    </td>
                  </tr>
                </sc-for>
              </tbody>
            </table>
          </div>
        </div>
        <aside>
          <section class="kk-card kk-card--md" style="gap: 12px;">
            <h2 class="title-3">Загрузить документ</h2>
            <p class="body-sm" style="color: var(--ink-secondary);">Проверим файл сразу после загрузки и привяжем к заявке.</p>
            <x-import component-from-global-scope="Cabinet.DocumentUpload" label="Перетащите файл или выберите на компьютере"></x-import>
          </section>
        </aside>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const n = ' ';
    const a = '№' + n + '2026-10-0142';
    return {
      no: false,
      docs: [
        { name: 'Кредитный договор', meta: 'PDF · 6 страниц', app: a, date: '24 октября', status: 'Подписано', tone: 'success', replace: false },
        { name: 'График платежей', meta: 'PDF · 1 страница', app: a, date: '24 октября', status: 'Подписано', tone: 'success', replace: false },
        { name: 'Заявление на выдачу', meta: 'PDF · 1 страница', app: a, date: '24 октября', status: 'Подписано', tone: 'success', replace: false },
        { name: 'Бухгалтерская отчётность за 2025 год', meta: 'PDF · 1,8 МБ', app: a, date: '24 октября', status: 'Принят', tone: 'success', replace: false },
        { name: 'Выписка из другого банка', meta: 'PDF · 640 КБ', app: a, date: '24 октября', status: 'Принят', tone: 'success', replace: false },
        { name: 'Договор поставки', meta: 'JPG · фото обрезано', app: a, date: '24 октября', status: 'Нужно заменить', tone: 'danger', replace: true },
        { name: 'Согласие на запрос в БКИ', meta: 'Подписано в кабинете', app: a, date: '24 октября', status: 'Подписано', tone: 'success', replace: false }
      ]
    };
  }
}
</script>
</body>
</html>
