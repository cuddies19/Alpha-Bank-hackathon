<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Icon — превью</title>
<style>.ic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:var(--space-2);width:100%}.ic-cell{display:flex;flex-direction:column;align-items:center;gap:var(--space-2);padding:var(--space-3) var(--space-1);border-radius:var(--radius-md);background:var(--surface);color:var(--ink)}.ic-cell .caption{color:var(--ink-secondary);font-weight:400}</style>
</head>
<body>
<div id="root" class="kk-preview"></div>
<script>
  var C = window.Cabinet, h = React.createElement;
  var names = ['sparkle','arrow-up','arrow-down','paperclip','document','upload','check','check-circle','clock','alert','info','x','x-circle','chevron-right','wallet','calendar','shield','circle','trend-up','trend-down'];
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'ic-grid' }, names.map(function (n) { return h('div', { key: n, className: 'ic-cell' }, h(C.Icon, { name: n, size: 24 }), h('span', { className: 'caption' }, n)); })));
</script>
</body>
</html>
