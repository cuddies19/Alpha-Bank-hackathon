<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>TextField — превью</title>
<style>.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:var(--space-5) var(--space-6)}</style>
</head>
<body>
<div id="root" class="kk-preview kk-preview--col"></div>
<script>
  var C = window.Cabinet, h = React.createElement;
  function Demo() {
    var a = React.useState('1 500 000'), b = React.useState('18'), c = React.useState('77012345');
    return h('div', { className: 'grid' },
      h(C.TextField, { label: 'Сумма', format: 'money', prefilled: true, value: a[0], onChange: function (e) { a[1](e.target.value); }, hint: 'Ассистент взял сумму из вашего сообщения' }),
      h(C.TextField, { label: 'Срок', suffix: 'мес.', inputMode: 'numeric', value: b[0], onChange: function (e) { b[1](e.target.value); }, hint: 'От 3 до 18 месяцев' }),
      h(C.TextField, { label: 'ИНН компании', inputMode: 'numeric', value: c[0], onChange: function (e) { c[1](e.target.value); }, error: 'У ООО в ИНН 10 цифр — здесь 8' }),
      h(C.TextField, { label: 'Электронная почта', type: 'email', placeholder: 'name@company.ru' }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
