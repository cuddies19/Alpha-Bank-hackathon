<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Badge — превью</title>
</head>
<body>
<div id="root" class="kk-preview"></div>
<script>
  var C = window.Cabinet, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(C.Badge, { tone: 'success' }, 'Одобрено'),
    h(C.Badge, { tone: 'info' }, 'На проверке'),
    h(C.Badge, { tone: 'warning' }, 'Нужен документ'),
    h(C.Badge, { tone: 'danger' }, 'Отказ'),
    h(C.Badge, { tone: 'accent' }, 'Рекомендуем'),
    h(C.Badge, null, 'Черновик')));
</script>
</body>
</html>
