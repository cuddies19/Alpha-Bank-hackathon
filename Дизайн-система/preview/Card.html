<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<script>document.documentElement.setAttribute('data-theme', new URLSearchParams(location.search).get('theme') || 'light');</script>
<link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/bundle.css"><script src="../components/lib/react.production.min.js"></script><script src="../components/lib/react-dom.production.min.js"></script><script src="../components/bundle.js"></script>
<title>Card — превью</title>
<style>.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--space-4)}</style>
</head>
<body>
<div id="root" class="kk-preview kk-preview--col"></div>
<script>
  var C = window.Cabinet, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'grid' },
    h(C.Card, null, h('h3', { className: 'title-3', style: { margin: 0 } }, 'Мои кредиты'), h('p', { className: 'body', style: { margin: '8px 0 0', color: 'var(--ink-secondary)' } }, 'Один действующий кредит, следующий платёж 5 ноября.')),
    h(C.Card, { tone: 'accent' }, h('h3', { className: 'title-3', style: { margin: 0 } }, 'Совет ассистента'), h('p', { className: 'body', style: { margin: '8px 0 0' } }, 'Перед сезоном выгоднее открыть линию, чем брать кредит целиком.')),
    h(C.Card, { as: 'button', interactive: true, style: { width: '100%' } }, h('h3', { className: 'title-3', style: { margin: 0 } }, 'Подобрать финансирование'), h('p', { className: 'body', style: { margin: '8px 0 0', color: 'var(--ink-secondary)' } }, 'Опишите задачу — ассистент предложит продукт.'))));
</script>
</body>
</html>
