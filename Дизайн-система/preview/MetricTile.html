<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<script>document.documentElement.setAttribute('data-theme', new URLSearchParams(location.search).get('theme') || 'light');</script>
<link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/bundle.css"><script src="../components/lib/react.production.min.js"></script><script src="../components/lib/react-dom.production.min.js"></script><script src="../components/bundle.js"></script>
<title>MetricTile — превью</title>
<style>.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--space-4)}</style>
</head>
<body>
<div id="root" class="kk-preview kk-preview--col"></div>
<script>
  var C = window.Cabinet, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'grid' },
    h(C.MetricTile, { label: 'Остаток на счёте', icon: 'wallet', value: C.formatMoney(2340500) }),
    h(C.MetricTile, { label: 'Поступления за 30 дней', value: C.formatMoney(4120000), delta: { value: '+12%', direction: 'up', tone: 'success', label: 'к сентябрю' } }),
    h(C.MetricTile, { label: 'Платежи по кредитам', icon: 'calendar', value: C.formatMoney(84200), hint: 'В месяц · 1 кредит до марта 2027' })));
</script>
</body>
</html>
