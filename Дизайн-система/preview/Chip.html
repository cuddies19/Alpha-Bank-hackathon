<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<script>document.documentElement.setAttribute('data-theme', new URLSearchParams(location.search).get('theme') || 'light');</script>
<link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/bundle.css"><script src="../components/lib/react.production.min.js"></script><script src="../components/lib/react-dom.production.min.js"></script><script src="../components/bundle.js"></script>
<title>Chip — превью</title>
</head>
<body>
<div id="root" class="kk-preview"></div>
<script>
  var C = window.Cabinet, h = React.createElement;
  function Demo() {
    var s = React.useState(0), sel = s[0], set = s[1];
    var opts = ['На закупку товара', 'Кассовый разрыв', 'Купить оборудование', 'Участие в тендере'];
    return h(React.Fragment, null, opts.map(function (o, i) { return h(C.Chip, { key: i, selected: sel === i, onClick: function () { set(i); } }, o); }), h(C.Chip, { disabled: true }, 'Рефинансирование'));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
