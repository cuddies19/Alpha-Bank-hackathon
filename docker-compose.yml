services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      MOCKS_URL: http://mocks:8090
    depends_on:
      postgres:
        condition: service_healthy
      mocks:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build: ./backend
    command: python -m app.pipeline.worker
    restart: on-failure
    stop_grace_period: 60s
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      MOCKS_URL: http://mocks:8090
      PIPELINE_SPEED: ${PIPELINE_SPEED:-normal}
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mocks:
        condition: service_healthy

  mocks:
    build: ./mocks
    ports:
      - "8090:8090"
    env_file:
      - path: mocks/.env
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  pgdata:
