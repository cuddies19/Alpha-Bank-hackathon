services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cabinet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cabinet}
      POSTGRES_DB: ${POSTGRES_DB:-cabinet}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Двойная проверка: официальный entrypoint на время initdb поднимает временный
      # Postgres, и одиночный pg_isready успевает отметить его как готовый. Второй
      # pg_isready через 2 секунды гарантирует, что уже работает финальный сервер.
      test:
        [
          "CMD-SHELL",
          "pg_isready -q -U $${POSTGRES_USER} -d $${POSTGRES_DB} && sleep 2 && pg_isready -q -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 5s
    ports:
      - "5432:5432"

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cabinet}:${POSTGRES_PASSWORD:-cabinet}@db:5432/${POSTGRES_DB:-cabinet}
      APP_ENV: ${APP_ENV:-dev}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-please-use-32-bytes}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo123}
      UPLOAD_DIR: data/uploads
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-10485760}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:4173}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
      PIPELINE_MOCKS_URL: http://mocks:8090
      ASSISTANT_MODE: ${ASSISTANT_MODE:-auto}
      ASSISTANT_OLLAMA_URL: ${ASSISTANT_OLLAMA_URL:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-qwen2.5:3b-instruct}
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    build:
      context: ./backend
    command: python -m app.pipeline.worker
    restart: on-failure
    stop_grace_period: 60s
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cabinet}:${POSTGRES_PASSWORD:-cabinet}@db:5432/${POSTGRES_DB:-cabinet}
      SEED_ON_STARTUP: "false"
      PIPELINE_MOCKS_URL: http://mocks:8090
      PIPELINE_SCORING_URL: ${PIPELINE_SCORING_URL:-http://api:8000}
      PIPELINE_SPEED: ${PIPELINE_SPEED:-normal}
    depends_on:
      api:
        condition: service_healthy
      mocks:
        condition: service_healthy

  mocks:
    build: ./mocks
    ports:
      - "8090:8090"
    env_file:
      - path: mocks/.env
        required: false
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  pgdata:
  uploads:
