name: backend

on:
  push:
    paths:
      - "backend/**"
      - "docs/openapi.json"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "docs/openapi.json"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite://
      SEED_ON_STARTUP: "false"
      JWT_SECRET: ci-secret-that-is-definitely-long-enough-123456
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run python scripts/export_openapi.py --check
